[package]
name = "dirtreeview"
version = "0.3.0"
edition = "2021"

[dependencies]
eframe = "0.29"
dirs-next = "2"
rfd = "0.15"
crossbeam-channel = "0.5"
rayon = "1.10"

# Per creare il bundle macOS (DirTreeView.app) con l'icona nel Dock/Finder:
#   cargo install cargo-bundle && cargo bundle --release
# Per il Dock serve un file .icns: aggiungilo in assets/ e mettilo in `icon`.
[package.metadata.bundle]
name = "DirTreeView"
identifier = "com.dirtreeview.app"
icon = ["assets/icon.icns"]
